name: Backend Render CD

on:
  push:
    branches: [main, master]
    paths:
      - 'algolens-backend/**'
      - '.github/workflows/backend-render.yml'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  test-and-deploy-render:
    name: Build & Trigger Render Deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algolens-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: algolens-backend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Verify TypeScript & Build Output
        run: npm run build

      # Trigger Render Deployment via Deploy Hook
      - name: Trigger Render Deploy Hook
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not set. Render will use Git-push automatic deployments if configured in the Render Dashboard."
          else
            echo "Triggering Render deployment..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered successfully!"
          fi
