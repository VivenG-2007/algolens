name: Monorepo CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Typecheck & Build Validation
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Node.js & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algolens-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: algolens-backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Run Backend TypeScript Check
        run: npx tsc --noEmit

      - name: Build Backend (dist/ compilation)
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Frontend Typecheck & Next.js Production Build
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Next.js 16 & React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algolens-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: algolens-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend TypeScript Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: https://algolens-backend.onrender.com
        run: npm run build
